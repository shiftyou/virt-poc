apiVersion: console.openshift.io/v1
kind: ConsoleYAMLSample
metadata:
  name: poc-bridge-nad
spec:
  title: "POC NAD — poc-bridge-nad"
  description: "Register as VM secondary network after applying NNCP. (Method: Linux Bridge)"
  targetResource:
    apiVersion: k8s.cni.cncf.io/v1
    kind: NetworkAttachmentDefinition
  yaml: |
    apiVersion: k8s.cni.cncf.io/v1
    kind: NetworkAttachmentDefinition
    metadata:
      name: poc-bridge-nad
      namespace: poc-network
    spec:
      config: |-
    {
        "cniVersion": "0.3.1",
        "name": "poc-bridge-nad",
        "type": "bridge",
        "bridge": "br-flat",
        "ipam": {},
        "macspoofchk": true,
        "preserveDefaultVlan": false
    }
